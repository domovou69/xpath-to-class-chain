<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 446" width="840" height="446" role="img" aria-label="Quality vs Cost: 5.5 models with rules">
<title>Quality vs Cost: 5.5 models with rules</title>
<style>
  svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --conv: #0b0b0b; --opus: #2a78d6; --sonnet: #eb6834; --haiku: #1baf7a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { svg { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --grid: #2c2c2a; --axis: #383835; --conv: #ffffff; --opus: #3987e5; --sonnet: #d95926; --haiku: #199e70; } }
  .bg { fill: var(--surface); }
  .t1 { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .t2, .tick { fill: var(--muted); font-size: 11px; }
  .sub { fill: var(--ink2); font-size: 12px; }
  .lab { fill: var(--ink2); font-size: 12px; } .labb { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--axis); stroke-width: 1; }
  .dot { stroke: var(--surface); stroke-width: 2; }
  .c-conv { fill: var(--conv); } .c-opus { fill: var(--opus); } .c-sonnet { fill: var(--sonnet); } .c-haiku { fill: var(--haiku); }
</style>
<rect class="bg" width="840" height="446" rx="8"/>
<text class="t1" x="70" y="28">Quality vs Cost: 5.5 models with rules</text>
<text class="sub" x="70" y="48">S against cost per run, models with the rules prompt; effort in brackets</text>
<line class="grid" x1="70" x2="580" y1="344.0" y2="344.0"/><text class="tick" x="62" y="348.0" text-anchor="end">0</text>
<line class="grid" x1="70" x2="580" y1="289.2" y2="289.2"/><text class="tick" x="62" y="293.2" text-anchor="end">20</text>
<line class="grid" x1="70" x2="580" y1="234.4" y2="234.4"/><text class="tick" x="62" y="238.4" text-anchor="end">40</text>
<line class="grid" x1="70" x2="580" y1="179.6" y2="179.6"/><text class="tick" x="62" y="183.6" text-anchor="end">60</text>
<line class="grid" x1="70" x2="580" y1="124.8" y2="124.8"/><text class="tick" x="62" y="128.8" text-anchor="end">80</text>
<line class="grid" x1="70" x2="580" y1="70.0" y2="70.0"/><text class="tick" x="62" y="74.0" text-anchor="end">100</text>
<text class="tick" x="70.0" y="362" text-anchor="middle">free</text>
<text class="tick" x="197.5" y="362" text-anchor="middle">$0.5</text>
<text class="tick" x="325.0" y="362" text-anchor="middle">$1</text>
<text class="tick" x="452.5" y="362" text-anchor="middle">$1.5</text>
<text class="tick" x="580.0" y="362" text-anchor="middle">$2</text>
<line class="axis" x1="70" x2="580" y1="344" y2="344"/><line class="axis" x1="70" x2="70" y1="70" y2="344"/>
<text class="t2" x="325.0" y="384" text-anchor="middle">Cost per run, 678 locators (up is better, left is cheaper)</text>
<text class="t2" transform="translate(16 207.0) rotate(-90)" text-anchor="middle">S, edge cases</text>
<circle class="dot c-conv" cx="70.0" cy="92.5" r="7"/>
<text class="labb" x="83.0" y="85.5" text-anchor="start">Converter</text><text class="lab" x="83.0" y="99.5" text-anchor="start">S 91.8 · R 95.8 · free</text>
<circle class="dot c-opus" cx="508.6" cy="108.4" r="7"/>
<text class="labb" x="521.6" y="83.4" text-anchor="start">Opus 5.5 (low)</text><text class="lab" x="521.6" y="97.4" text-anchor="start">S 86.0 · R 95.0 · 5.1 min · $1.72</text>
<circle class="dot c-sonnet" cx="472.9" cy="114.4" r="7"/>
<text class="labb" x="465.9" y="139.4" text-anchor="start">Sonnet 5.5 (low)</text><text class="lab" x="465.9" y="153.4" text-anchor="start">S 83.8 · R 95.0 · 8.9 min · $1.58</text>
<circle class="dot c-haiku" cx="138.9" cy="149.2" r="7"/>
<text class="labb" x="151.9" y="142.2" text-anchor="start">Haiku 5.5 (medium)</text><text class="lab" x="151.9" y="156.2" text-anchor="start">S 71.1 · R 94.8 · 5.7 min · $0.27</text>
<text class="t2" x="70" y="416"><tspan font-weight="600">S</tspan> = score on 114 edge cases, <tspan font-weight="600">R</tspan> = score on 562 real-world locators that have a chain (0–100 each).</text>
<text class="t2" x="70" y="432">A correct chain counts 1, a documented approximation counts 0.5, a skipped, wrong or invalid chain counts 0.</text>
</svg>
