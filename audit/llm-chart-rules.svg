<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 446" width="840" height="446" role="img" aria-label="Quality vs Cost: 5.5 models with rules">
<title>Quality vs Cost: 5.5 models with rules</title>
<style>
  svg { --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781; --grid: #e1e0d9; --axis: #c3c2b7; --conv: #0b0b0b; --opus: #2a78d6; --sonnet: #eb6834; --haiku: #1baf7a; --bad: #c9302c; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { svg { --surface: #1a1a19; --ink: #ffffff; --ink2: #c3c2b7; --grid: #2c2c2a; --axis: #383835; --conv: #ffffff; --opus: #3987e5; --sonnet: #d95926; --haiku: #199e70; --bad: #ff6b66; } }
  .bg { fill: var(--surface); }
  .t1 { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .t2, .tick { fill: var(--muted); font-size: 11px; }
  .sub { fill: var(--ink2); font-size: 12px; }
  .lab { fill: var(--ink2); font-size: 12px; } .labb { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; } .axis { stroke: var(--axis); stroke-width: 1; }
  .bad { fill: var(--bad); font-size: 12px; } .badn { fill: var(--bad); font-size: 11px; }
  .ref { stroke: var(--conv); stroke-width: 1; stroke-dasharray: 4 4; }
  .dot { stroke: var(--surface); stroke-width: 2; } .ln { fill: none; stroke-width: 2; stroke-linejoin: round; }
  .c-conv { fill: var(--conv); } .c-opus { fill: var(--opus); } .c-sonnet { fill: var(--sonnet); } .c-haiku { fill: var(--haiku); }
  .l-opus { stroke: var(--opus); } .l-sonnet { stroke: var(--sonnet); } .l-haiku { stroke: var(--haiku); }
</style>
<rect class="bg" width="840" height="446" rx="8"/>
<text class="t1" x="70" y="28">Quality vs Cost: 5.5 models with rules</text>
<text class="sub" x="70" y="48">S against cost per run, models with the rules prompt</text>
<line class="grid" x1="70" x2="470" y1="344.0" y2="344.0"/><text class="tick" x="62" y="348.0" text-anchor="end">70</text>
<line class="grid" x1="70" x2="470" y1="252.7" y2="252.7"/><text class="tick" x="62" y="256.7" text-anchor="end">80</text>
<line class="grid" x1="70" x2="470" y1="161.3" y2="161.3"/><text class="tick" x="62" y="165.3" text-anchor="end">90</text>
<line class="grid" x1="70" x2="470" y1="70.0" y2="70.0"/><text class="tick" x="62" y="74.0" text-anchor="end">100</text>
<text class="tick" x="70.0" y="362" text-anchor="middle">free</text>
<text class="tick" x="170.0" y="362" text-anchor="middle">$0.5</text>
<text class="tick" x="270.0" y="362" text-anchor="middle">$1</text>
<text class="tick" x="370.0" y="362" text-anchor="middle">$1.5</text>
<text class="tick" x="470.0" y="362" text-anchor="middle">$2</text>
<line class="axis" x1="70" x2="470" y1="344" y2="344"/><line class="axis" x1="70" x2="70" y1="70" y2="344"/>
<text class="t2" x="270" y="384" text-anchor="middle">Cost per run, 678 locators (up is better, left is cheaper)</text>
<text class="t2" transform="translate(16 207) rotate(-90)" text-anchor="middle">S, edge cases</text>
<text class="t2" x="700" y="148" text-anchor="end">output tokens</text><text class="t2" x="700" y="160" text-anchor="end">(thinking)</text><text class="t2" x="745" y="160" text-anchor="end">min</text><text class="t2" x="800" y="160" text-anchor="end">cost</text>
<line class="ref" x1="70" x2="470" y1="144.9" y2="144.9"/><text class="labb" x="78" y="136.9">Converter <tspan class="lab" font-weight="400">S 91.8 · R 95.8 · free</tspan></text>
<circle class="dot c-conv" cx="506.0" cy="182.0" r="5"/><text class="labb" x="518" y="186.0">Converter<tspan class="lab" font-weight="400"> </tspan></text>
<text class="lab" x="700" y="186.0" text-anchor="end">—</text><text class="lab" x="745" y="186.0" text-anchor="end">—</text><text class="lab" x="800" y="186.0" text-anchor="end">free</text>
<circle class="dot c-opus" cx="414.0" cy="197.9" r="7"/>
<text class="labb" x="414.0" y="167.9" text-anchor="middle">Opus 5.5</text><text class="lab" x="414.0" y="181.9" text-anchor="middle">S 86.0 · R 95.0</text>
<circle class="dot c-opus" cx="506.0" cy="202.0" r="5"/><text class="labb" x="518" y="206.0">Opus 5.5<tspan class="lab" font-weight="400"> low</tspan></text>
<text class="lab" x="700" y="206.0" text-anchor="end">45k (4k)</text><text class="lab" x="745" y="206.0" text-anchor="end">5.1</text><text class="lab" x="800" y="206.0" text-anchor="end">$1.72</text>
<circle class="dot c-sonnet" cx="386.0" cy="218.0" r="7"/>
<text class="labb" x="374.0" y="216.0" text-anchor="end">Sonnet 5.5</text><text class="lab" x="374.0" y="230.0" text-anchor="end">S 83.8 · R 95.0</text>
<circle class="dot c-sonnet" cx="506.0" cy="222.0" r="5"/><text class="labb" x="518" y="226.0">Sonnet 5.5<tspan class="lab" font-weight="400"> low</tspan></text>
<text class="lab" x="700" y="226.0" text-anchor="end">93k (32k)</text><text class="lab" x="745" y="226.0" text-anchor="end">8.9</text><text class="lab" x="800" y="226.0" text-anchor="end">$1.58</text>
<circle class="dot c-haiku" cx="124.0" cy="334.0" r="7"/>
<text class="labb" x="136.0" y="318.0" text-anchor="start">Haiku 5.5</text><text class="lab" x="136.0" y="332.0" text-anchor="start">S 71.1 · R 94.8</text>
<circle class="dot c-haiku" cx="506.0" cy="242.0" r="5"/><text class="labb" x="518" y="246.0">Haiku 5.5<tspan class="lab" font-weight="400"> medium</tspan></text>
<text class="lab" x="700" y="246.0" text-anchor="end">102k (45k)</text><text class="lab" x="745" y="246.0" text-anchor="end">5.7</text><text class="lab" x="800" y="246.0" text-anchor="end">$0.27</text>
<text class="t2" x="70" y="416"><tspan font-weight="600">S</tspan> = score on edge cases, <tspan font-weight="600">R</tspan> = score on real-world locators that have a chain (0–100 each).</text>
</svg>